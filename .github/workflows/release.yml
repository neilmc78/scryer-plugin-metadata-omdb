name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, such as v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Test
        run: cargo test -p omdb-core

      - name: Build the component
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: scryer-plugin-metadata-omdb
          path: dist/scryer-plugin-metadata-omdb.wasm

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # A manual run creates the tag on the commit it built.
          gh release create "$TAG" dist/scryer-plugin-metadata-omdb.wasm \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
