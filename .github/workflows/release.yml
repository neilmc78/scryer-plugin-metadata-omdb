name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Test
        run: cargo test -p omdb-core

      - name: Build the component
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: scryer-plugin-metadata-omdb
          path: dist/scryer-plugin-metadata-omdb.wasm

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/scryer-plugin-metadata-omdb.wasm \
            --title "$GITHUB_REF_NAME" --generate-notes
